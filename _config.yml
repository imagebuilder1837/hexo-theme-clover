# Custom nav
nav:
  title: Clover

favicon: ""

# Custom background
background:
  color: "#eff0f6"
  image: ""

# Social media
social:
  GitHub: https://example.com/github

# Custom footer
mail: hello@example.com
copyright: Example site by <a href="https://example.com/author">Example Author</a> · <a href="https://example.com/terms">Example Terms</a>

# Custom menu. You can specific the path or the card style (only useful for category page).
# Two kinds of card style: 'project-card', 'article-card',
# Never mind the name.
menu:
  # Project:
  #   path: /categories/Projects
  #   card: project-card
  # Stuffs:
  #   path: /tags/Stuffs
  #   card: article-card
  Home: /
  Archive: /archives
  Tag: /tags
  About: /about

# Specific default categories or tags of home page.
# Match either category or tag; any matching exception excludes the post.
# Empty or missing conditions do not restrict the home page.
home:
  # set card style of home page
  # category: Projects
  # tag: 算法
  # except_category: 树
  # except_tag:
  #   - 总结
  #   - css

card_style:
  home: project-card
  archive: article-card
  tag: article-card
  category: article-card

# category page
category_generator:
  category_per_page: 3
  post_per_category: 3

node_sass:
  precision: 5
  sourceComments: false