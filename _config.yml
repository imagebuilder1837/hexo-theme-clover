# Custom nav
nav:
  title: Clover

favicon: ""

# Custom background
background:
  color: "#eff0f6"
  image: ""

# Social media
social:
  GitHub: https://example.com/github

# Custom footer
mail: hello@example.com
copyright: Example site by <a href="https://example.com/author">Example Author</a> · <a href="https://example.com/terms">Example Terms</a>

# Custom menu. You can specific the path or the card style (only useful for category page).
# Two kinds of card style: 'project-card', 'article-card',
# Never mind the name.
menu:
  # Project:
  #   path: /categories/Projects
  #   card: project-card
  # Stuffs:
  #   path: /tags/Stuffs
  #   card: article-card
  Home: /
  Archive: /archives
  Tag: /tags
  About: /about

card_style:
  home: project-card
  archive: article-card
  tag: article-card
  category: article-card

# Optional progressive enhancement; code remains readable without JavaScript.
code_copy: false

# Modern Dart Sass options; site-level sass values override these defaults.
sass:
  style: expanded